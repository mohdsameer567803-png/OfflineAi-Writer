name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and locate Android project root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './unpacked/*' | head -n 1)"
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            rm -rf unpacked
            mkdir unpacked
            unzip -q -o "$ZIP" -d unpacked
          else
            echo "No zip found, searching the repository itself."
          fi

          SETTINGS="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -not -path './.git/*' -not -path '*/build/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle.kts found. Make sure OfflineAIWriter.zip is uploaded to the repository root."
            ls -R . | head -n 100
            exit 1
          fi

          DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "Android project root: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -name '*debug*.apk' -path '*/outputs/apk/*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced. Check the build step logs above."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineAIWriter-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
